services:
  # ==========================================================================
  # Elasticsearch - Test Results Storage
  # ==========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: rf-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=rf-automation-cluster
      - node.name=rf-automation-node
      - bootstrap.memory_lock=false
      - network.host=0.0.0.0
      - http.cors.enabled=true
      - "http.cors.allow-origin=\"*\""
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - rf-net
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  # ==========================================================================
  # Kibana - Data Visualization
  # ==========================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: rf-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=rf-automation-kibana
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    networks:
      - rf-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ==========================================================================
  # Mock Spectrum Analyzer
  # ==========================================================================
  mock-spectrum-analyzer:
    build:
      context: ../mock_equipment
      dockerfile: Dockerfile
    container_name: mock-sa
    environment:
      - EQUIPMENT_TYPE=spectrum_analyzer
      - SCPI_PORT=5001
      - HTTP_PORT=8000
      - HTTP_HOST=0.0.0.0
      - ENABLE_HARMONICS=true
      - ENABLE_INTERMOD=true
      - HARMONIC_ORDER=3
      - NOISE_FLOOR_DBM=-120
      - ENABLE_RF_PHYSICS=true
    ports:
      - "5001:5001"
      - "8001:8000"
    networks:
      - rf-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # Mock Signal Generator
  # ==========================================================================
  mock-signal-generator:
    build:
      context: ../mock_equipment
      dockerfile: Dockerfile
    container_name: mock-sg
    environment:
      - EQUIPMENT_TYPE=signal_generator
      - SCPI_PORT=5002
      - HTTP_PORT=8000
      - HTTP_HOST=0.0.0.0
      - ENABLE_HARMONICS=true
      - HARMONIC_ORDER=3
    ports:
      - "5002:5002"
      - "8002:8000"
    networks:
      - rf-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # Mock DUT (Device Under Test)
  # ==========================================================================
  mock-dut:
    build:
      context: ../mock_equipment
      dockerfile: Dockerfile
    container_name: mock-dut
    environment:
      - EQUIPMENT_TYPE=dut
      - SCPI_PORT=5003
      - HTTP_PORT=8000
      - HTTP_HOST=0.0.0.0
      - SIGNAL_PROCESSING_MODE=linear
    ports:
      - "5003:5003"
      - "8003:8000"
    networks:
      - rf-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # Jenkins - CI/CD Server
  # ==========================================================================
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: rf-jenkins
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - CASC_JENKINS_CONFIG=/var/jenkins_config/casc.yaml
      - JENKINS_ADMIN_PASSWORD=admin
      - JENKINS_OPTS=--prefix= -Dhudson.security.csrf.GlobalCrumbIssuerConfiguration.DISABLE_CSRF_PROTECTION=true
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - MOCK_SPECTRUM_ANALYZER_HOST=mock-spectrum-analyzer
      - MOCK_SIGNAL_GENERATOR_HOST=mock-signal-generator
      - MOCK_DUT_HOST=mock-dut
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins/casc.yaml:/var/jenkins_config/casc.yaml:ro
      - ..:/var/jenkins_home/workspace/RF-Automation
    networks:
      - rf-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/login || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

networks:
  rf-net:
    driver: bridge
    name: rf-automation-network

volumes:
  elasticsearch_data:
    driver: local
    name: rf-elasticsearch-data
  jenkins_home:
    driver: local
    name: rf-jenkins-home

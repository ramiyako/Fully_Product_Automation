# ELK Stack Infrastructure
# Elasticsearch and Kibana for test results storage and visualization
# Production-ready configuration for on-premise deployment

version: '3.8'

services:
  # Elasticsearch - Test results database
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    hostname: elasticsearch

    environment:
      # Single-node cluster configuration
      - discovery.type=single-node

      # Disable security for internal network (enable for production)
      - xpack.security.enabled=false

      # Memory settings (2GB heap recommended for NUC with 32GB RAM)
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"

      # Cluster name
      - cluster.name=rf-automation-cluster

      # Node name
      - node.name=rf-automation-node-1

      # Disable bootstrap memory checks (for development)
      - bootstrap.memory_lock=false

      # Network settings
      - network.host=0.0.0.0

      # HTTP CORS (for Kibana)
      - http.cors.enabled=true
      - http.cors.allow-origin=*

    ports:
      - "9200:9200"  # REST API
      - "9300:9300"  # Node communication

    volumes:
      - es_data:/usr/share/elasticsearch/data
      - es_logs:/usr/share/elasticsearch/logs

    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    restart: unless-stopped

    networks:
      - elk

  # Kibana - Visualization and dashboard
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    hostname: kibana

    environment:
      # Elasticsearch connection
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

      # Server configuration
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0

      # Monitoring
      - MONITORING_UI_CONTAINER_ELASTICSEARCH_ENABLED=true

      # Logging
      - LOGGING_VERBOSE=false

    ports:
      - "5601:5601"

    volumes:
      - kibana_data:/usr/share/kibana/data

    depends_on:
      elasticsearch:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    restart: unless-stopped

    networks:
      - elk

# Named volumes for data persistence
volumes:
  es_data:
    driver: local
    name: elasticsearch_data

  es_logs:
    driver: local
    name: elasticsearch_logs

  kibana_data:
    driver: local
    name: kibana_data

# Custom network for ELK communication
networks:
  elk:
    driver: bridge
    name: elk_network

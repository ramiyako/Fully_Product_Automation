# Allure Report Configuration
# This file configures Allure report generation for RF automation tests

# Report title displayed in the browser tab and header
allure.report.title=RF Equipment Automation Test Report

# Project name shown in the report
allure.project.name=RF Equipment Test Automation

# Environment information displayed in the report
# These can be overridden by environment files or at runtime
allure.environment.project=RF Automation Infrastructure
allure.environment.framework=Robot Framework 7.0
allure.environment.test.runner=Docker Container
allure.environment.platform=Ubuntu Server 24.04 LTS

# Report customization
allure.report.encoding=UTF-8
allure.report.language=en

# Enable/disable test result history
allure.results.history.enabled=true

# Maximum number of test runs to keep in history
allure.results.history.max.runs=20

# Categories configuration file (optional)
# allure.results.categories.path=categories.json

# Enable/disable retries display
allure.results.retries.enabled=true

# Severity levels (can be customized)
# blocker, critical, normal, minor, trivial
allure.severity.default=normal

# Link patterns for issue tracking integration
# Example: JIRA integration
# allure.link.issue.pattern=https://jira.company.com/browse/{}
# allure.link.tms.pattern=https://testmanagement.company.com/test/{}

# Trend chart configuration
allure.chart.trend.enabled=true

# Executor information (filled by Jenkins automatically)
allure.executor.name=Jenkins CI/CD
allure.executor.type=jenkins

# Report logo (optional - place logo.png in allure-results directory)
# allure.report.logo.path=logo.png

# Custom CSS (optional)
# allure.report.custom.css.path=custom.css

# Custom JavaScript (optional)
# allure.report.custom.js.path=custom.js
